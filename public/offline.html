<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline - Pinjam Alat Kampus</title>
<style>
    body { margin:0; font-family: Inter, Arial, sans-serif; background:#EFEFF4; color:#22232E;
        display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; box-sizing:border-box; }
    .box { max-width:360px; text-align:center; background:#fff; border:1px solid #E2E3EA; border-radius:16px; padding:32px; }
    h1 { font-size:20px; line-height:28px; margin:0 0 8px; }
    p { font-size:14px; line-height:20px; color:#6B6F7E; margin:0 0 24px; }
    button { height:48px; padding:0 24px; border-radius:8px; border:none; background:#4F46E5;
        color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
    button:focus-visible { outline:2px solid #4F46E5; outline-offset:2px; }
</style>
</head>
<body>
    <main class="box">
        <h1>Kamu sedang offline</h1>
        <p>Pinjam Alat Kampus butuh koneksi internet untuk memuat data terbaru. Periksa koneksimu lalu coba lagi.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </main>
</body>
</html>
